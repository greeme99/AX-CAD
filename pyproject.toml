[project]
name = "ax-cad"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cadquery-ocp-novtk==8.0.1.1.0",
    "defusedxml>=0.7.1",
    "ezdxf",
    "fastapi",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "python-multipart",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.1.4",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pypdf>=6.20.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["Research", "docs"]  # source material: never reformat code samples in markdown

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
