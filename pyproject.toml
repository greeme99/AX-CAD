[project]
name = "ax-cad"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ezdxf", "fastapi", "python-multipart", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["Research", "docs"]  # source material: never reformat code samples in markdown

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
