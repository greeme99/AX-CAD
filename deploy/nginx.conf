# Single entry point: /api -> FastAPI, everything else -> Next.js.
server {
    listen 8080;
    server_tokens off;

    # STEP/IGES imports are capped at 100 MB by the API (DXF 50 MB); the API rejects oversize itself
    client_max_body_size 101m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;  # STEP/IGES exchange may take up to 120 s
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
