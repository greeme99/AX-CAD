# HTTPS (AXCAD_PROXY=https). Certificate and key from deploy/config/tls/ (server.crt, server.key).
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 8080;
    server_tokens off;
    return 301 https://$host$request_uri;  # HTTPS is published on 443 (AXCAD_TLS_PORT)
}

server {
    listen 8443 ssl;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/axcad/locations.inc;
}
