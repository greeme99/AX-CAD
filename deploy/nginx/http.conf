# Plain HTTP (AXCAD_PROXY=http, default). Intranet trial / UAT only: logins and tokens travel
# unencrypted. Production: AXCAD_PROXY=https with an internal-CA certificate (deploy/README.md).
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 8080;
    server_tokens off;
    include /etc/nginx/axcad/locations.inc;
}
