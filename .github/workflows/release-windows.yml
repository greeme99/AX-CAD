# Signed per-PC release (Track 7): run by hand from the Actions tab.
# Needs installer/patch_pub.hex (committed public key) and the AXCAD_PATCH_KEY secret (the matching
# private key, hex) — see docs/PC_설치_가이드.md §4. Produces, as workflow artifacts:
#   AX-CAD-<v>-win-x64.zip        first install on a new PC (install.cmd)
#   AX-CAD-<v>-patch.zip          update: server, web, scripts (runtimes must match)
#   AX-CAD-<v>-full-patch.zip     update: every component (after a runtime change)
# Two jobs so the signing key never shares a runner with the build: third-party packages run code
# while they install (and the bundled Python loads their .pth files). The sign job reads the built
# bundle as data only, with patcher.py from its own checkout on the runner's Python (-I -S).
name: Windows release
run-name: Windows release ${{ inputs.version }}${{ inputs.from_version && format(' UPGRADE from {0}', inputs.from_version) || ' UPDATE' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.2, 1.1.0 = R1.1) — newer than the installed one; needs installer/release-notes/<version>.txt"
        required: true
      from_version:
        description: "Leave empty for an UPDATE (same major). Only for an UPGRADE to a new major (e.g. 2.0.0): the last version of the previous major (e.g. 1.3.0)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # grade follows from the inputs (from_version given = UPGRADE); the rules patcher.py applies when
      # signing are checked here, before a long build is wasted on a typo
      - name: Check inputs
        id: check
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          FROM_VERSION: ${{ inputs.from_version }}
        run: |
          $re = '^\d{1,4}\.\d{1,4}\.\d{1,6}$'
          $v = $env:VERSION; $from = "$env:FROM_VERSION".Trim()
          if ($v -notmatch $re) { throw "version '$v': 1.0.2 형식이어야 합니다" }
          $major = [int]$v.Split('.')[0]
          if ($from) {
            if ($from -notmatch $re -or [int]$from.Split('.')[0] + 1 -ne $major) {
              throw "from_version '$from' 은 $v 의 직전 major($($major - 1).x) 마지막 버전이어야 합니다. 같은 major 안의 릴리스(예: 1.0.1 -> 1.0.2, 1.1.0)는 from_version 을 비워 두세요"
            }
            $grade = 'UPGRADE'
          } else {
            if ($v -match '\.0\.0$' -and $major -gt 1) {
              throw "$v 은 새 major 입니다: from_version 에 직전 major 의 마지막 버전(예: $($major - 1).3.0)을 넣으세요"
            }
            $grade = 'UPDATE'
          }
          if (-not (Test-Path "installer/release-notes/$v.txt")) {
            $have = (Get-ChildItem installer/release-notes -Filter *.txt).BaseName -join ', '
            throw "installer/release-notes/$v.txt 가 없습니다 (있는 노트: $have). 버전 오타가 아닌지 확인하고, 새 버전이면 노트를 먼저 커밋하세요"
          }
          "grade=$grade" >> $env:GITHUB_OUTPUT
          "from=$from" >> $env:GITHUB_OUTPUT
          Write-Host "release $v $grade $from"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: 0.11.32
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Build the bundle
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GRADE: ${{ steps.check.outputs.grade }}
          FROM_VERSION: ${{ steps.check.outputs.from }}
        run: |
          if (-not (Test-Path installer/patch_pub.hex)) { throw 'installer/patch_pub.hex missing: create the signing key first (docs/PC_설치_가이드.md §4)' }
          ./installer/windows/build.ps1 -Version $env:VERSION -PubKey installer/patch_pub.hex -Grade $env:GRADE -FromVersion "$env:FROM_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bundle
          path: |
            dist/AX-CAD-${{ inputs.version }}-win-x64.zip
          retention-days: 1

  sign:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'  # signing runs main's patcher.py only (also enforce on the environment)
    environment: release  # set required reviewers and "main only" on it: it holds the signing key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bundle
          path: dist
      - name: Sign the patches
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          AXCAD_PATCH_KEY: ${{ secrets.AXCAD_PATCH_KEY }}
        run: |
          if (-not $env:AXCAD_PATCH_KEY) { throw 'AXCAD_PATCH_KEY secret missing' }
          $zip = "dist/AX-CAD-$env:VERSION-win-x64.zip"
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/b"
          $app = "$env:RUNNER_TEMP/b/app"
          if ((Get-Content "$app/scripts/patch_pub.hex").Trim() -ne (Get-Content installer/patch_pub.hex).Trim()) { throw 'bundle carries a different public key' }
          $key = Join-Path $env:RUNNER_TEMP 'k.hex'
          Set-Content -Encoding ASCII -NoNewline -Path $key -Value $env:AXCAD_PATCH_KEY
          try {
            python -I -S installer/patcher.py make $app --key $key --out "dist/AX-CAD-$env:VERSION-patch.zip" --only server,web,scripts
            if ($LASTEXITCODE -ne 0) { throw 'patch failed' }
            python -I -S installer/patcher.py make $app --key $key --out "dist/AX-CAD-$env:VERSION-full-patch.zip"
            if ($LASTEXITCODE -ne 0) { throw 'full patch failed' }
          } finally { Remove-Item $key -Force }
          Get-ChildItem dist -Filter "AX-CAD-$env:VERSION*.zip" | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: AX-CAD-${{ inputs.version }}-windows
          path: |
            dist/AX-CAD-${{ inputs.version }}*.zip
            dist/SHA256SUMS.txt
          retention-days: 30
      # an existing PC needs only the patch: a small download without the bundled runtimes' .exe
      # files, which browsers block as "dangerous" in the 460 MB all-in-one artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: AX-CAD-${{ inputs.version }}-patch-only
          path: |
            dist/AX-CAD-${{ inputs.version }}-patch.zip
            dist/SHA256SUMS.txt
          retention-days: 30
