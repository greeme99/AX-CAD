# Fast gates of the Verification Matrix (CLAUDE.md) on every PR and on main.
# E2E (TC-82) is not run here: it needs a live API + web stack and an ACTIVE price master.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # keep every main run

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axcad
          POSTGRES_PASSWORD: axcad-ci  # throwaway container, reachable only from this job
          POSTGRES_DB: axcad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axcad -d axcad_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://axcad:axcad-ci@localhost:5432/axcad_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the OCP (OpenCASCADE) wheel links against libGL/X11 even without a display
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: 0.11.32
          enable-cache: true
      - run: uv sync --locked  # fails when uv.lock is stale against pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy core backend
      - run: uv run pytest -q -rs tests/

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
